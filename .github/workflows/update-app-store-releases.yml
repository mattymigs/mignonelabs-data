name: Update App Store release data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_app_releases.py
      - tests/test_sync_app_releases.py
      - .github/workflows/update-app-store-releases.yml

permissions:
  contents: write

concurrency:
  group: app-store-release-sync
  cancel-in-progress: false

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run archive validation tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch and validate configured public app releases
        run: python3 scripts/sync_app_releases.py

      - name: Commit only changed release data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'apps/*.json'; then
            echo "Apple data checked successfully; no archive changes."
            exit 0
          fi
          git config user.name "mignonelabs-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'apps/*.json'
          git commit -m "Archive current public App Store release data"
          git pull --rebase origin main
          git push origin HEAD:main
